[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "coalition-eval"
version = "0.1.0"
description = "Comprehensive evaluation framework for Coalition LLM agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Coalition", email = "coalition@liberation-labs.org" }
]
keywords = ["llm", "evaluation", "agent", "benchmark", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "numpy>=1.24.0",
    "typer>=0.9.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "datasets>=2.14.0",  # HuggingFace datasets
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.25.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-xdist>=3.3.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
coalition-eval = "coalition_eval.cli:app"

[project.urls]
Homepage = "https://github.com/Liberation-Labs-THCoalition/orchestrator-benchmarks"
Repository = "https://github.com/Liberation-Labs-THCoalition/orchestrator-benchmarks"

[tool.hatch.build.targets.wheel]
packages = ["coalition_eval"]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "W", "I", "UP", "B", "C4"]

[tool.mypy]
python_version = "3.11"
strict = true
